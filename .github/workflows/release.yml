name: Release

# Tests run locally (`make check`, enforced by the pre-push hook). This workflow only checks the
# release rules, creates the GitHub release for a version tag with notes built from the commit
# titles, and reports start and finish to Slack. Products depend on the tag through a git
# dependency (see the README).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release check and the notes read the previous tag and the commits since it.
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - uses: ./.github/actions/slack-notify
        with:
          status: start
          title: Release
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CICD_CHANNEL }}

      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pubspec.yaml" >&2
            exit 1
          fi

      - name: Check the release rules
        run: dart tool/release.dart check --commit "$GITHUB_SHA"

      - name: Build the release notes
        run: dart tool/release.dart notes --commit "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME"

      - uses: ./.github/actions/slack-notify
        if: always()
        with:
          status: ${{ job.status }}
          title: Release
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CICD_CHANNEL }}
